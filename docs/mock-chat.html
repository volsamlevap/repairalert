<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "DejaVu Sans", sans-serif; background: #e9e9ec; width: 1520px; height: 1180px; overflow: hidden; }
  .win { width: 1460px; height: 1120px; margin: 24px auto 0; background: #ffffff; border: 1px solid #d9d9de; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 34px rgba(0,0,0,.12); display: flex; flex-direction: column; }
  .tabs { padding: 16px 20px 0; }
  .tabs-in { display: inline-flex; background: #f0f0f3; border-radius: 22px; padding: 5px; }
  .tab { padding: 10px 26px; font-size: 21px; color: #6b6b70; border-radius: 17px; }
  .tab.active { background: #fff; color: #1b1b1b; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .history { flex: 1; padding: 20px 26px; position: relative; }
  .pinned { background: #e8f0fb; border-radius: 10px; padding: 13px 20px; font-size: 20px; color: #1b1b1b; margin: 6px 0 22px; }
  .bubble { max-width: 46%; border-radius: 20px; padding: 14px 20px 10px; font-size: 23px; line-height: 1.35; margin-bottom: 18px; }
  .bubble .meta { font-size: 17px; color: #9a9aa0; margin-top: 5px; }
  .bubble.in { background: #f0f0f3; color: #1b1b1b; border-bottom-left-radius: 6px; }
  .bubble.out { background: #0b6bcb; color: #fff; margin-left: auto; border-bottom-right-radius: 6px; }
  .bubble.out .meta { color: rgba(255,255,255,.75); text-align: right; }
  .fileline { display: flex; align-items: center; gap: 12px; }
  .fileicon { width: 42px; height: 42px; border-radius: 10px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; }
  .fileicon svg { width: 22px; height: 22px; }
  .fname { font-size: 22px; }
  .fsize { font-size: 17px; color: rgba(255,255,255,.75); }
  .menu { position: absolute; right: 200px; top: 300px; width: 380px; background: #fff; border-radius: 16px; box-shadow: 0 14px 44px rgba(0,0,0,.22); border: 1px solid #e6e6ea; padding: 8px; }
  .mi { display: flex; align-items: center; gap: 16px; padding: 13px 16px; font-size: 21px; color: #1b1b1b; border-radius: 10px; }
  .mi svg { width: 22px; height: 22px; flex: none; }
  .composer { margin: 0 20px 20px; background: #f0f0f3; border-radius: 26px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .cbtn { width: 52px; height: 52px; border-radius: 50%; background: #0b6bcb; display: flex; align-items: center; justify-content: center; flex: none; }
  .cbtn svg { width: 24px; height: 24px; }
  .placeholder { flex: 1; font-size: 22px; color: #9a9aa0; padding-left: 10px; }
</style>
</head>
<body>
<div class="win">
  <div class="tabs"><div class="tabs-in">

  </div></div>

      <div class="mi"><svg viewBox="0 0 24 24" fill="#1b1b1b"><path d="M10,4H4C2.9,4 2.01,4.9 2.01,6L2,18c0,1.1 0.9,2 2,2h16c1.1,0 2-0.9 2-2V8c0-1.1-0.9-2-2-2h-8l-2-2z"/></svg>Показать в папке</div>

    </div>
  </div>
  <div class="composer">
    <div class="cbtn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 1 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></div>
    <div class="cbtn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
      <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/>
      <rect x="6.2" y="6.2" width="0.6" height="0.6" fill="#fff"/><rect x="17.2" y="6.2" width="0.6" height="0.6" fill="#fff"/><rect x="6.2" y="17.2" width="0.6" height="0.6" fill="#fff"/>
      <rect x="14" y="14" width="3" height="3" rx="0.8" fill="#fff" stroke="none"/><rect x="18" y="14" width="3" height="3" rx="0.8" fill="#fff" stroke="none"/><rect x="14" y="18" width="3" height="3" rx="0.8" fill="#fff" stroke="none"/><rect x="18" y="18" width="3" height="3" rx="0.8" fill="#fff" stroke="none"/>
    </svg></div>
    <div class="placeholder">Сообщение…</div>
    <div class="cbtn"><svg viewBox="0 0 24 24" fill="#fff"><path d="M2,21L23,12 2,3v7l15,2-15,2v7z"/></svg></div>
  </div>
</div>
</body>
</html>
